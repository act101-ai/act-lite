name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:
    inputs:
      os:
        description: runner for an on-demand platform floor (macos-latest or windows-latest)
        required: true
        default: windows-latest

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.os || 'push' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  floor:
    name: floor (${{ github.event.inputs.os || 'ubuntu-latest' }})
    runs-on: ${{ github.event.inputs.os || 'ubuntu-latest' }}
    outputs:
      installer_ps: ${{ steps.scope.outputs.installer_ps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: scope to the change
        id: scope
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            changed=$(git ls-files)
          else
            changed=$(git diff --name-only "$base" HEAD)
          fi
          crates=$(printf '%s\n' "$changed" | sed -n 's#^crates/\([^/]*\)/.*#\1#p' | sort -u)
          if printf '%s\n' "$changed" | grep -qE '^(Cargo\.(toml|lock)|deny\.toml|rustfmt\.toml|\.github/|vendor/)'; then crates=all; fi
          # dependents, from each crates/*/Cargo.toml: core -> parser, lsp, cli; parser -> lsp, cli; lsp -> cli; secrets -> cli
          case "$crates" in *act-lite-core*) crates="$crates act-lite-parser" ;; esac
          case "$crates" in *act-lite-parser*) crates="$crates act-lite-lsp" ;; esac
          case "$crates" in *act-lite-lsp*|*act-lite-secrets*) crates="$crates act-lite-cli" ;; esac
          pkgs=""
          if [ "$crates" = all ]; then pkgs="--workspace"; else for c in $(printf '%s' "$crates" | tr ' ' '\n' | sort -u); do pkgs="$pkgs -p $c"; done; fi
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed" | grep -qE '^(Cargo\.(toml|lock)|deny\.toml)' && echo "deny=true" >> "$GITHUB_OUTPUT" || echo "deny=false" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed" | grep -qE '^(Cargo\.(toml|lock)|crates/[^/]*/Cargo\.toml)$' && echo "msrv=true" >> "$GITHUB_OUTPUT" || echo "msrv=false" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed" | grep -qE '^(plugin/skills/work-graph/scripts/|tests/scripts/)' && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed" | grep -qE '^(Cargo\.(toml|lock)|crates/[^/]*/Cargo\.toml|about\.(toml|hbs))$' && echo "licenses=true" >> "$GITHUB_OUTPUT" || echo "licenses=false" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed" | grep -qE '^install\.sh$' && echo "installer=true" >> "$GITHUB_OUTPUT" || echo "installer=false" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed" | grep -qE '^install\.ps1$' && echo "installer_ps=true" >> "$GITHUB_OUTPUT" || echo "installer_ps=false" >> "$GITHUB_OUTPUT"
          echo "rust: ${pkgs:-none}"
      - name: cargo fmt --check
        if: steps.scope.outputs.pkgs != ''
        run: cargo fmt --check
      - name: cargo check
        if: steps.scope.outputs.pkgs != ''
        run: cargo check ${{ steps.scope.outputs.pkgs }}
      - name: cargo test
        if: steps.scope.outputs.pkgs != ''
        run: cargo test ${{ steps.scope.outputs.pkgs }} --no-fail-fast
      - name: cargo clippy
        if: steps.scope.outputs.pkgs != ''
        run: cargo clippy ${{ steps.scope.outputs.pkgs }} --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        if: steps.scope.outputs.deny == 'true'
        with:
          tool: cargo-deny
      - name: cargo deny check
        if: steps.scope.outputs.deny == 'true'
        run: cargo deny check
      - uses: taiki-e/install-action@v2
        if: steps.scope.outputs.licenses == 'true' && runner.os == 'Linux'
        with:
          tool: cargo-about@0.9.3
      - name: THIRD-PARTY-LICENSES is current
        if: steps.scope.outputs.licenses == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          cargo about generate --config about.toml --output-file THIRD-PARTY-LICENSES about.hbs
          git diff --exit-code THIRD-PARTY-LICENSES
      - name: read minimum rust version
        id: msrv
        if: steps.scope.outputs.msrv == 'true'
        shell: bash
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        if: steps.scope.outputs.msrv == 'true'
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: cargo check on the minimum rust version
        if: steps.scope.outputs.msrv == 'true'
        run: cargo check --workspace --locked
      - name: work graph script tests
        if: steps.scope.outputs.python == 'true'
        run: python3 -m unittest discover -s tests/scripts -v
      - name: shellcheck install.sh
        if: steps.scope.outputs.installer == 'true' && runner.os == 'Linux'
        run: shellcheck install.sh

  installer-windows:
    needs: floor
    if: ${{ !cancelled() && needs.floor.outputs.installer_ps == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer install.ps1
        shell: pwsh
        run: |
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          $found | Format-Table -AutoSize
          if ($found) { exit 1 }
      - name: install.ps1 against a local release
        shell: pwsh
        run: |
          # A stand-in release: curl.exe answers --version like act-lite.exe does.
          $root = Join-Path $env:RUNNER_TEMP 'release'
          $target = 'x86_64-pc-windows-msvc'
          foreach ($tag in 'v0.0.1', 'v0.0.2') {
            $name = "act-lite-$tag-$target"
            New-Item -ItemType Directory -Force "$root\$tag\stage\$name" | Out-Null
            Copy-Item "$env:SystemRoot\System32\curl.exe" "$root\$tag\stage\$name\act-lite.exe"
            Compress-Archive -Path "$root\$tag\stage\$name" -DestinationPath "$root\$tag\$name.zip"
            $hash = (Get-FileHash -Algorithm SHA256 "$root\$tag\$name.zip").Hash.ToLower()
            if ($tag -eq 'v0.0.2') { $hash = '0' * 64 }
            [IO.File]::WriteAllText("$root\$tag\$name.zip.sha256", "$hash  $name.zip`n")
          }
          Copy-Item install.ps1 $root
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $root -PassThru
          for ($i = 0; $i -lt 50; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/install.ps1 | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
          }
          $env:ACT_LITE_BASE_URL = 'http://127.0.0.1:8765'
          $dir = Join-Path $env:RUNNER_TEMP 'bin'
          $env:ACT_LITE_INSTALL_DIR = $dir
          $run = 'irm http://127.0.0.1:8765/install.ps1 | iex'
          $failed = $false
          foreach ($shell in 'powershell', 'pwsh') {
            Write-Host "== ${shell}: install, then install again over the first copy"
            $env:ACT_LITE_VERSION = 'v0.0.1'
            foreach ($round in 1, 2) {
              & $shell -NoProfile -ExecutionPolicy Bypass -Command $run
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$dir\act-lite.exe")) { Write-Host "FAIL: $shell install round $round"; $failed = $true }
            }
            Write-Host "== ${shell}: an installation waits while another holds the install lock"
            $held = [IO.File]::Open("$dir\.act-lite.install.lock", 'OpenOrCreate', 'ReadWrite', 'None')
            $waiting = Start-Process $shell -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-Command', $run -PassThru
            $null = $waiting.Handle  # keeps ExitCode readable after exit
            Start-Sleep -Seconds 5
            $waited = -not $waiting.HasExited -and -not (Test-Path "$dir\.act-lite.old.exe")
            $held.Dispose()
            if (-not $waiting.WaitForExit(120000)) { $waiting.Kill() }
            if (-not $waited -or $waiting.ExitCode -ne 0 -or -not (Test-Path "$dir\act-lite.exe")) { Write-Host "FAIL: $shell did not wait for the install lock, or failed after it"; $failed = $true }
            Write-Host "== ${shell}: a failed replacement keeps the installed copy"
            $before = (Get-FileHash "$dir\act-lite.exe").Hash
            $env:ACT_LITE_TEST_FAIL_REPLACE = '1'
            & $shell -NoProfile -ExecutionPolicy Bypass -Command $run
            Remove-Item Env:ACT_LITE_TEST_FAIL_REPLACE
            if ($LASTEXITCODE -eq 0 -or -not (Test-Path "$dir\act-lite.exe") -or (Get-FileHash "$dir\act-lite.exe").Hash -ne $before) { Write-Host "FAIL: $shell lost act-lite.exe after a failed replacement"; $failed = $true }
            Write-Host "== ${shell}: checksum mismatch installs nothing"
            Remove-Item -Recurse -Force $dir
            $env:ACT_LITE_VERSION = 'v0.0.2'
            & $shell -NoProfile -ExecutionPolicy Bypass -Command $run
            if ($LASTEXITCODE -eq 0 -or (Test-Path "$dir\act-lite.exe")) { Write-Host "FAIL: $shell installed despite a checksum mismatch"; $failed = $true }
          }
          foreach ($shell in 'powershell', 'pwsh') {
            Write-Host "== ${shell}: a relative ACT_LITE_INSTALL_DIR is taken from PowerShell's location"
            $rel = Join-Path $env:RUNNER_TEMP "rel-$shell"
            $env:ACT_LITE_INSTALL_DIR = ".\rel-$shell"
            $env:ACT_LITE_VERSION = 'v0.0.1'
            # The process directory differs from PowerShell's location.
            & $shell -NoProfile -ExecutionPolicy Bypass -Command "[Environment]::CurrentDirectory = `$env:SystemRoot; Set-Location `$env:RUNNER_TEMP; $run"
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$rel\act-lite.exe") -or -not (Test-Path "$rel\.act-lite.install.lock")) { Write-Host "FAIL: $shell did not install into $rel"; $failed = $true }
            if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains $rel) { Write-Host "FAIL: $shell did not put the absolute $rel on the user PATH"; $failed = $true }
          }
          $env:ACT_LITE_INSTALL_DIR = $dir
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $dir) { Write-Host "FAIL: $dir is not on the user PATH"; $failed = $true }
          Stop-Process -Id $server.Id
          # explicit: the runner otherwise exits with $LASTEXITCODE, which the mismatch case sets to 1
          if ($failed) { exit 1 } else { exit 0 }
