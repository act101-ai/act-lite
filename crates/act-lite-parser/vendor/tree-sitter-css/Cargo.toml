[package]
name = "tree-sitter-css"
version = "0.25.0"
description = "CSS grammar for tree-sitter"
authors = ["Max Brunsfeld <maxbrunsfeld@gmail.com>", "Amaan Qureshi <contact@amaanq.com>"]
license = "MIT"
repository = "https://github.com/tree-sitter/tree-sitter-css"
edition = "2021"
build = "build.rs"
include = ["grammar.js", "build.rs", "lib.rs", "src/**/*"]

[lib]
path = "lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.25"

[build-dependencies]
cc = "1.2"
