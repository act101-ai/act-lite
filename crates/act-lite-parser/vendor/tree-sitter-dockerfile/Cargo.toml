[package]
name = "tree-sitter-dockerfile"
version = "0.2.1"
authors = ["Stephan Seitz <stephan.seitz@fau.de>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "dockerfile"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/camdencheek/tree-sitter-dockerfile"
edition = "2021"
autoexamples = false

build = "build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "LICENSE",
]

[lib]
path = "lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25"
