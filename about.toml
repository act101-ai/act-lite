# cargo-about 0.9.3 configuration. Regenerate THIRD-PARTY-LICENSES with:
#   cargo install cargo-about --version 0.9.3 --locked --features cli
#   cargo about generate --config about.toml --output-file THIRD-PARTY-LICENSES about.hbs
# Use exactly this version: another version can change the output.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# tree-sitter-astro-next declares "MIT or Apache-2.0" but ships only the
# Apache-2.0 text, and its scanner is the MIT-licensed scanner of
# tree-sitter-astro. The crate is listed with the Apache-2.0 text it ships and
# with MIT; about.hbs adds the upstream MIT text with its copyright line.
[tree-sitter-astro-next.clarify]
license = "Apache-2.0 AND MIT"

[[tree-sitter-astro-next.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "62c7a1e35f56406896d7aa7ca52d0cc0d272ac022b5d2796e7d6905db8a3636a"
