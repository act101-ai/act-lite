# cargo-deny configuration: `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `chrono` is unmaintained (an INFO notice, not a vulnerability) and has no
    # safe upgrade. rmcp 3.9 depends on it unconditionally, and schemars pulls
    # it too; act-lite does not use it directly. Operator ruling 2026-11-17:
    # ignore. Remove this entry when rmcp and schemars no longer pull chrono.
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
# Every license not listed here is denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
